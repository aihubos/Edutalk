services:
  web:
    image: ${EDUTALK_IMAGE:?Set the release image}
    container_name: edutalk-web
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4328:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DATA_MODE: demo
      NEXT_PUBLIC_APP_URL: https://edutalk.ai-hub-os.com
      NEXT_TELEMETRY_DISABLED: "1"
    mem_limit: 512m
    cpus: 0.75
    logging:
      options:
        max-size: "5m"
        max-file: "2"
  tunnel:
    image: cloudflare/cloudflared:2025.6.1
    container_name: edutalk-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    volumes:
      - /opt/edutalk/secrets/tunnel-token:/run/secrets/tunnel-token:ro
    mem_limit: 128m
    cpus: 0.25
    logging:
      options:
        max-size: "5m"
        max-file: "2"
