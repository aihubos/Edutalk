name: EDU톡 GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 정적 페이지 준비
        run: |
          mkdir -p _site/assets
          cp -R github-pages/. _site/
          cp public/icons/icon-192.png _site/assets/icon-192.png

      - name: 정적 페이지 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
