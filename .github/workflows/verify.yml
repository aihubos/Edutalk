name: EDU톡 자동 점검

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 확인
        run: pnpm typecheck

      - name: 코드 규칙 확인
        run: pnpm lint

      - name: 운영 빌드
        run: pnpm build

      - name: 공공데이터 무변경 점검
        run: pnpm data:sync:dry-run
